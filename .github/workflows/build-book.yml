name: Build LaTeX book

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Compile the book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Exercise Set I (Version B)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: exercise_set_01_version_b.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Exercise Set I worked solutions (Version B)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: exercise_set_01_version_b_solutions.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Exercise Set II (Version B)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: exercise_set_02_version_b.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Exercise Set II worked solutions (Version B)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: exercise_set_02_version_b_solutions.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Midterm Examination (Chapters 1--10)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: midterm_exam_2026_chapters_01_10.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Midterm Examination worked solutions
        uses: xu-cheng/latex-action@v4
        with:
          root_file: midterm_exam_2026_chapters_01_10_solutions.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Report PDF length
        shell: bash
        run: |
          if [[ -s ppe-page-count.txt ]]; then
            page_count=$(tr -d '[:space:]' < ppe-page-count.txt)
            echo "Book pages: ${page_count}"
            if (( page_count > 200 )); then
              echo "::error::The compiled book exceeds the 200-page limit."
              exit 1
            fi
          else
            echo "::error::LaTeX did not produce ppe-page-count.txt."
            exit 1
          fi

      - name: Upload the compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: microeconomics-ppe-book
          path: main.pdf
          if-no-files-found: error

      - name: Upload Exercise Set I (Version B)
        uses: actions/upload-artifact@v7
        with:
          name: exercise-set-01-version-b
          path: exercise_set_01_version_b.pdf
          if-no-files-found: error

      - name: Upload Exercise Set I worked solutions (Version B)
        uses: actions/upload-artifact@v7
        with:
          name: exercise-set-01-version-b-solutions
          path: exercise_set_01_version_b_solutions.pdf
          if-no-files-found: error

      - name: Upload Exercise Set II (Version B)
        uses: actions/upload-artifact@v7
        with:
          name: exercise-set-02-version-b
          path: exercise_set_02_version_b.pdf
          if-no-files-found: error

      - name: Upload Exercise Set II worked solutions (Version B)
        uses: actions/upload-artifact@v7
        with:
          name: exercise-set-02-version-b-solutions
          path: exercise_set_02_version_b_solutions.pdf
          if-no-files-found: error

      - name: Upload Midterm Examination (Chapters 1--10)
        uses: actions/upload-artifact@v7
        with:
          name: midterm-exam-2026-chapters-01-10
          path: midterm_exam_2026_chapters_01_10.pdf
          if-no-files-found: error

      - name: Upload Midterm Examination worked solutions
        uses: actions/upload-artifact@v7
        with:
          name: midterm-exam-2026-chapters-01-10-solutions
          path: midterm_exam_2026_chapters_01_10_solutions.pdf
          if-no-files-found: error
