name: Build LaTeX book

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Compile the book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Report PDF length
        shell: bash
        run: |
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo main.pdf | awk '/^Pages:/ {print}'
          else
            echo "pdfinfo is unavailable on this runner; compilation succeeded."
          fi

      - name: Upload the compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: microeconomics-ppe-book
          path: main.pdf
          if-no-files-found: error
